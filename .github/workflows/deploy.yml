name: AcademiaClaw CI/CD Auto-Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Run Backend Unit Tests
        run: |
          export PYTHONPATH=.
          python backend/tests/test_fsrs.py
          python backend/tests/test_lightrag.py

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend React App
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy-to-vps:
    name: Deploy to IDwebhost VPS
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check deploy credentials
        # Without this the SSH action fails with a bare "can't connect without a
        # private SSH key or password", which says nothing about what to fix.
        run: |
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::VPS_SSH_KEY is not set."
            echo "This workflow is key-only on purpose: the root password was published"
            echo "in this repository's git history, so password auth is not an option."
            echo ""
            echo "To fix, on your machine:"
            echo "  ssh-keygen -t ed25519 -C academiaclaw-deploy -f ~/.ssh/academiaclaw"
            echo "  ssh-copy-id -p <PORT> -i ~/.ssh/academiaclaw.pub root@<HOST>"
            echo "then add the PRIVATE key (~/.ssh/academiaclaw) as the VPS_SSH_KEY secret,"
            echo "and delete the VPS_PASSWORD secret."
            echo ""
            echo "Full steps: RUNBOOK.md, step 4."
            exit 1
          fi
          echo "VPS_SSH_KEY present."

      - name: Deploy via SSH
        # Pinned to a release tag rather than @master: an unpinned third-party
        # action executes whatever its author pushes next, with our deploy key.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          # Key-only. Password auth over SSH on a public repo is how the old
          # root password leaked in the first place.
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # script_stop was removed in ssh-action v1; `set -e` is the equivalent.
            set -e
            if [ ! -d "/opt/academiaclaw/.git" ]; then
              echo "Cloning repository for the first time..."
              rm -rf /opt/academiaclaw
              git clone https://github.com/${{ github.repository }}.git /opt/academiaclaw
              chmod +x /opt/academiaclaw/scripts/*.sh
              /opt/academiaclaw/scripts/setup_vps.sh
            fi
            chmod +x /opt/academiaclaw/scripts/*.sh
            /opt/academiaclaw/scripts/deploy.sh
